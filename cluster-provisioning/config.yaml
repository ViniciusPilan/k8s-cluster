kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    labels:
      role: control-plane
      ingress-ready: "true"

  - role: worker
    labels:
      role: worker
      tier: base
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP

  - role: worker
    labels:
      role: worker
      tier: general

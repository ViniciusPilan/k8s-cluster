apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: echo-api
  name: echo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo-api
  template:
    metadata:
      labels:
        app: echo-api
    spec:
      containers:
      - image: echo-api:dev
        name: echo-api
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: echo-api
  name: echo-api
spec:
  ports:
  - name: app
    port: 8080
    protocol: TCP
  selector:
    app: echo-api
  type: ClusterIP

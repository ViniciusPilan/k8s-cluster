apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    grafana_datasource: "1"
  name: prometheus-grafana-datasource
  namespace: metrics
data:
  datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: "Loki"
      type: loki
      uid: loki
      url: http://loki-gateway.logs.svc:80
      access: proxy
      isDefault: true
      jsonData:
        httpMethod: POST
        timeInterval: 10s

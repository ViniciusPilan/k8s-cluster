apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: over-requests
  name: over-requests
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: over-requests
  template:
    metadata:
      labels:
        app: over-requests
    spec:
      containers:
      - image: over-requests:dev
        name: over-requests
        resources:
          requests: 
            cpu: 50m
            memory: 160Mi
          limits:
            cpu: '0.5'
            memory: 500Mi
        command: ["python"]
        args: ["main.py", "http://echo-api:8080/echo", "1", "--time=360", "--log=DEBUG"]

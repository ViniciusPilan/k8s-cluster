apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-ingress-controller
  namespace: argocd
spec:
  project: default
  sources:
  # - repoURL: https://github.com/ViniciusPilan/k8s-cluster.git
  #   targetRevision: echo-api
  #   ref: values
  - repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.11.1
    # helm:
    #   valueFiles:
    #   - $values/cluster/envs/dev/prometheus/values.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: ingress
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
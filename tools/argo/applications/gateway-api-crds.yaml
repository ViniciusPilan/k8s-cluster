apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
spec:
  project: default

  source:
    repoURL: ghcr.io/nicklasfrahm/charts/gateway-api
    targetRevision: 0.2.0
    chart: gateway-api

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

# Full chart values for Grafana Alloy version 1.12.1: https://github.com/grafana/alloy/blob/helm-chart/1.12.1/operations/helm/charts/alloy/values.yaml

controller:
  # A single scraper avoids every DaemonSet replica scraping every pod.
  type: deployment
  replicas: 1

alloy:
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      prometheus.scrape "scrape_metrics" {
        targets         = discovery.kubernetes.pods.targets
        forward_to      = [prometheus.remote_write.metrics_service.receiver]
        scrape_interval = "30s"
      }

      prometheus.remote_write "metrics_service" {
        endpoint {
          url = "http://mimir-gateway.mimir.svc.cluster.local/api/v1/push"
          headers = {
            "X-Scope-OrgID" = "anonymous",
          }
        }
      }
